[package]
name = "slung"
version = "0.2.0-alpha.1"
edition = "2024"
authors = ["Ewan <ewan@slung.tech>"]
license = "MIT"
description = "An abstraction library for interacting with the Slung runtime."
repository = "https://github.com/slunghq/slung"
publish = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slung-macros = { version = "0.2.1", path = "macros" }

[profile.release]
lto = true
opt-level = "z"

[profile.dev]
opt-level = 1

[workspace]
default-members = ["."]
members = [".", "macros"]
exclude = ["examples/*"]
resolver = "3"
