name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: blacksmith-8vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check code formatting
        run: zig fmt --check .

      - name: Run tests
        run: zig build test
