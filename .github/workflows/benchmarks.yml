name: Benchmarks

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: CodSpeed (benches)
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run CodSpeed benchmark
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: nix develop -c zig build benches -- --runner

  perf-native:
    name: Native Perf (benches)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(join(github.event.commits.*.added, ' '), 'benches.zig') ||
        contains(join(github.event.commits.*.modified, ' '), 'benches.zig') ||
        contains(join(github.event.commits.*.removed, ' '), 'benches.zig') ||
        contains(join(github.event.commits.*.added, ' '), 'build.zig') ||
        contains(join(github.event.commits.*.modified, ' '), 'build.zig') ||
        contains(join(github.event.commits.*.removed, ' '), 'build.zig') ||
        contains(join(github.event.commits.*.added, ' '), 'src/memory/') ||
        contains(join(github.event.commits.*.modified, ' '), 'src/memory/') ||
        contains(join(github.event.commits.*.removed, ' '), 'src/memory/')
      ))
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run native benchmark
        run: nix develop -c zig build benches
