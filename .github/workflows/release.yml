name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.artifact_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            artifact_os: linux
            artifact_arch: x64
            artifact_target: x86_64-linux-gnu
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            artifact_os: linux
            artifact_arch: arm64
            artifact_target: aarch64-linux-gnu
          - os: blacksmith-6vcpu-macos-latest
            artifact_os: macos
            artifact_arch: arm64
            artifact_target: aarch64-macos
          - os: blacksmith-2vcpu-windows-2025
            artifact_os: windows
            artifact_arch: x64
            artifact_target: x86_64-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        if: matrix.artifact_os != 'windows'
        uses: cachix/install-nix-action@v31

      - name: Install Zig on Windows
        if: matrix.artifact_os == 'windows'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build release binary (Unix)
        if: matrix.artifact_os != 'windows'
        env:
          TARGET: ${{ matrix.artifact_target }}
        run: nix develop -c zig build --release=fast -Dtarget=${TARGET}

      - name: Build release binary (Windows)
        if: matrix.artifact_os == 'windows'
        env:
          TARGET: ${{ matrix.artifact_target }}
        shell: bash
        run: zig build --release=fast -Dtarget=${TARGET}

      - name: Package artifact
        env:
          OS: ${{ matrix.artifact_os }}
          ARCH: ${{ matrix.artifact_arch }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p dist
          name="slung-${TAG}-${OS}-${ARCH}"
          if [ "${OS}" = "windows" ]; then
            cp zig-out/bin/slung.exe "dist/slung.exe"
            tar -C dist -czf "${name}.tar.gz" slung.exe
          else
            cp zig-out/bin/slung "dist/slung"
            chmod +x dist/slung
            tar -C dist -czf "${name}.tar.gz" slung
          fi
          sha256sum "${name}.tar.gz" > "${name}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slung-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: |
            slung-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
            slung-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          body_path: docs/RELEASE.md
          files: |
            slung-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
            slung-${{ github.ref_name }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.sha256
